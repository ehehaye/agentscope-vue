<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" type="image/svg+xml" href="<%= BASE_URL %>agentscope.svg" />
		<title>AgentScope</title>
		<script>
			// 首帧前应用主题，避免深色闪烁。
			// 优先级：localStorage('theme') > 系统偏好；与 Vuex app 模块同源。
			(function () {
				try {
					var stored = localStorage.getItem('theme');
					var dark =
						stored != null
							? stored === 'dark'
							: window.matchMedia('(prefers-color-scheme: dark)').matches;
					document.documentElement.classList.toggle('dark', dark);
				} catch (e) {
					/* localStorage 不可用时跟随脚本默认（浅色） */
				}
			})();
		</script>
	</head>
	<body>
		<noscript>
			<strong>本站点需要启用 JavaScript 才能正常运行。</strong>
		</noscript>
		<div id="root"></div>
		<!-- built files will be auto injected -->
	</body>
</html>
